[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; THIS UPLOAD PORT FOR LINUX
; WINDOWN USE "COM(PORT)"
upload_port  = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = ${env:esp32dev.upload_port}
monitor_speed = 115200
; monitor_dtr = 0
; monitor_rts = 0

lib_deps =
   https://github.com/johnrickman/LiquidCrystal_I2C
   keypad
   miguelbalboa/MFRC522

; lib_ldf_mode = deep+