  <!DOCTYPE html>
  <html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFID Payment Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      /* Variables */
      :root {
        --background: #1da1f2;
        --card: #ffffff;
        --card-red: #f3354c;
        --top: #1d91f2;
        --text: #0f1419;
        --primary: #1da1f2;
        --primary-red: #e70e28;
        --success: #16a34a;
        --danger: #dc2626;
        --info: #2563eb;
        --muted: #f3f4f6;
        --radius: 0.75rem;
        --radius-sm: 0.5rem;
        --shadow:  0 2px 4px rgba(0, 0, 0, 0.4),
                   0 8px 20px rgba(0, 0, 0, 0.3);
      }

      /* Body */
      body {
        margin: 0;
        font-family: 'Open Sans', sans-serif;
        background-color: #f8f6f6;
        color: var(--text);   
        padding: 24px;
      }

      h1 {
        font-family: "Rammetto One", sans-serif;
        font-size: 2rem;  
        margin-bottom: 24px;
        /* font-weight: bold; */
        font-weight: 400;
        color: #000000;
        letter-spacing: 2px

      }

      /* Grid */
      .grid {
        display: grid;
        gap: 16px;
      }

      /* Responsive columns */
      .grid-1 { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr 1fr; }
      .grid-3 { grid-template-columns: 1fr 1fr 1fr 1fr; }
      .grid-4 { grid-template-columns: 1fr 2fr; }
      .grid-5 { grid-template-columns: 3fr 1fr; }
      @media (max-width: 767px) {
        .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr; }
      }

      
      /* Card */
      .card {
        background-color: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
      
      }

      .card1 {
        position: relative;
        /* background-color: var(--primary); */
        background: linear-gradient(135deg, #0271b6 0%, #54beff, #1da1f2 100%);
        backdrop-filter: blur(10px);
        color: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
        overflow: visible;
        overflow: hidden;
      }

      .card2 {
        position: relative;
        background: linear-gradient(135deg, #f3354c 0%, #ff6879, #a10719 100%);
        color: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;  
        overflow: visible;
        overflow: hidden;
      }

      .card3 {
        position: relative;
        background: linear-gradient(135deg, #cacaca 0%, #ffffff, #fff9c7 100%);
        color: text-black;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
        overflow: visible;
        overflow: hidden;
      }
      .card4 {
        position: relative;
        background: linear-gradient(135deg,#f58d06, #ffe0b7, #ffb049 100%, #cf7500 );
        color: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
        overflow: visible;
        overflow: hidden;
      }

      .background-circles {
        position: absolute;
        top: 0;
        right: 0;
        width: 100%;
        height: 100%;
      }

      .circle {
        position: absolute;
        background-color: #006bc369;
        border-radius: 50%;
      }

      .circle-1 {
        width: 140px;
        height: 140px;
        top: -50px;
        right: -70px;
        z-index: 1;
      }

      .circle-2 {
        width: 140px;
        height: 140px;
        background-color: #007ee59d;
        top: -70px;
        right: -20px;
        z-index: 0; /* ให้อยู่หลังวงกลมแรก */
      }

      .circle-3 {
        width: 140px;
        height: 140px;
        background-color: #930e1d77;
        top: -50px;
        right: -70px;
        z-index: 1;
      }

      .circle-4 {
        width: 140px;
        height: 140px;
        background-color: #b11c2d96;
        top: -70px;
        right: -20px;
        z-index: 0; /* ให้อยู่หลังวงกลมแรก */
      }
      .circle-5 {
        width: 140px;
        height: 140px;
        background-color: rgba(255, 217, 0, 0.3);
        top: -50px;
        right: -70px;
        z-index: 1;
      }

      .circle-6 {
        width: 140px;
        height: 140px;
        background-color: rgba(255, 240, 157, 0.5);
        top: -70px;
        right: -20px;
        z-index: 0;
      }
      .circle-7 {
        width: 140px;
        height: 140px;
        background-color: rgba(255, 136, 0, 0.493);
        top: -50px;
        right: -70px;
        z-index: 1;
      }

      .circle-8 {
        width: 140px;
        height: 140px;
        background-color: rgba(255, 165, 63, 0.479);
        top: -70px;
        right: -20px;
        z-index: 0;
      }

      .card h2, .card h4 {
        margin-bottom: 8px;
        font-weight: 600;
      }

      .text-2xl {
        font-size: 1.5rem;
        font-weight: bold;
      }

      .text-green { color: var(--success); }
      .text-red { color: var(--danger); }
      .text-blue { color: var(--info); }
      .text-black { color: #000; }
      /* Table */
      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        padding: 8px;
        border: 1px solid #e5e7eb;
        text-align: left;
      }

      th {
        background-color: var(--muted);
      }

      /* Select */
      select {
        padding: 8px;
        border-radius: var(--radius);
        border: 1px solid #d1d5db;
        margin-bottom: 16px;
        width: 100%;
      }

      /* Chart container */
      .chart-container {
        background-color: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
        margin-bottom: 24px;
      }
      .bath {
        font-size: 24px;
        margin-right: 4px; 
        margin-bottom: 4px;
        font-weight: bold;
        
      }
      .fade-in {
        animation: fadeIn 0.4s ease;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-3px); }
        to { opacity: 1; transform: translateY(0); }
      }
      :root {
    --bg: #f9fafb;
    --card: #ffffff;
    --shadow: 0 2px 8px rgba(0,0,0,0.04);
    --success: #16a34a;
    --danger: #dc2626;
    --text: #111827;
    --muted: #6b7280;
    --radius: 10px;
    --font: "Inter", "Segoe UI", sans-serif;
    --primary: #3b82f6;
  }

  /* กล่องหลัก */
  .tx-container {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    font-family: var(--font);
  }

  /* รายการธุรกรรมทั้งหมด */
  .tx-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
  }

  /* กล่องธุรกรรมแต่ละรายการ */
  .tx-item {
    background: #f9fafb;
    border-radius: var(--radius);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.2s;
  }
  .tx-item:hover {
    background: #eef2ff;
    transform: translateY(-1px);
  }

  /* ฝั่งซ้าย */
  .tx-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tx-id {
    color: var(--muted);
    font-size: 13px;
  }
  .tx-card {
    font-weight: 600;
    color: var(--text);
    font-size: 14px;
  }

  /* ฝั่งขวา */
  .tx-right {
    text-align: right;
  }
  .tx-type {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .tx-type.topup {
    color: var(--success);
  }
  .tx-type.payment {
    color: var(--danger);
  }
  .tx-amount {
    font-weight: 600;
    font-size: 15px;
  }
  .tx-time {
    font-size: 12px;
    color: var(--muted);
  }

  .tx-pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 15px;
    font-size: 14px;
    color: var(--muted);
  }
  .tx-pagination button {
    border: none;
    background: var(--bg);
    padding: 8px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text);
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .tx-pagination button:hover:not(:disabled) {
    background: var(--primary);
    color: white;
  }
  .tx-pagination button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  
.model-card {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 460px; /* ปรับความสูงตามต้องการ */
  position: relative;
}

  #modelContainer {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  #modelContainer canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
    object-fit: contain; /* ให้โมเดลอยู่ในขอบโดยไม่บิด */
  }

  #loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    padding: 8px 16px;
    border-radius: 10px;
  }
  .animated-number {
  transition: color 1s ease, transform 1s ease;
  color: #7dff4a;
  transform: scale(1.50);
  }

      
  </style>

  <script>

    const API = "";
    
    //------------------------- Load summary -------------------------
    // async function loadSummary() {
    //   const res = await fetch(`${API}/api/summary`);
    //   const data = await res.json();
    //   document.getElementById("total_topup").innerText = data.total_topup.toFixed(2);

    //------------------------- Load summary + Animate numbers -------------------------
    function animateValue(id, start, end, duration = 1500) {
      const element = document.getElementById(id);
      let startTime = null;

      function animate(currentTime) {
        if (!startTime) startTime = currentTime;
        const progress = Math.min((currentTime - startTime) / duration, 1);

        // ทำให้ตัวเลขเคลื่อนไหวแบบเนียน (ease-out)
        const eased = 1 - Math.pow(1 - progress, 3);
        const value = start + (end - start) * eased;

        element.innerText = value.toFixed(2);

        if (progress < 1) requestAnimationFrame(animate);
        else {
          element.innerText = end.toFixed(2); // ให้แน่ใจว่าค่าสุดท้ายถูกต้อง
          element.classList.add("animated-number");
          setTimeout(() => element.classList.remove("animated-number"), 300); // รีเซ็ตคลาสหลังอนิเมชั่น
        }
        
      }

      requestAnimationFrame(animate);
    }

    async function loadSummary() {
      const res = await fetch(`${API}/api/summary`);
      const data = await res.json();

      // เริ่มจาก 0 แล้วนับขึ้นถึงค่าจริง
      // ดึงค่าปัจจุบันจาก DOM แล้วใช้เป็นจุดเริ่มต้นของอนิเมชั่น
      const currentTopup = parseFloat(document.getElementById("total_topup").innerText) || 0;
      const currentPayment = parseFloat(document.getElementById("total_payment").innerText) || 0;
      const currentBalance = parseFloat(document.getElementById("balance_left").innerText) || 0;

      animateValue("total_topup", currentTopup, data.total_topup, 1500);
      animateValue("total_payment", currentPayment, data.total_payment, 1500);
      animateValue("balance_left", currentBalance, data.balance_left, 1500);

    }


    
    //------------------------- End Load summary -------------------------

    //------------------------- Load cards for select -------------------------
    async function loadCards() {
      const res = await fetch(`${API}/api/customers`);
      const data = await res.json();
      const select = document.getElementById("cardSelect");
      select.innerHTML = data.map(c => `<option value="${c.card_id}">${c.card_id} - ${c.full_name}</option>`).join("");
      if(data.length>0) loadCardData(data[0].card_id);
      select.addEventListener("change", e => loadCardData(e.target.value));
    }
    //---------------------- End Load cards for select -------------------------

    //------------------------- Load card data and render chart -------------------------
    async function loadCardData(cardId) {
      const res = await fetch(`${API}/history/${cardId}`);
      const data = await res.json();
      const days = data.map(d => d.day);
      const topups = data.map(d => d.total_topup);
      const payments = data.map(d => d.total_payment);

      const ctx = document.getElementById('lineChart').getContext('2d');

      const gradientTopup = ctx.createLinearGradient(0, 0, 0, 300);
      gradientTopup.addColorStop(0, 'rgba(173, 216, 230, 0.9)');
      gradientTopup.addColorStop(1, 'rgba(173, 216, 230, 0.1)');

      const gradientPayment = ctx.createLinearGradient(0, 0, 0, 300);
      gradientPayment.addColorStop(0, 'rgba(250, 100, 100, 0.4)');
      gradientPayment.addColorStop(1, 'rgba(250, 100, 100, 0.05)');

      if (window.lineChartInstance) window.lineChartInstance.destroy();

      window.lineChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: days,
          datasets: [
            {
              label: 'Top-Up',
              data: topups,
              borderColor: '#87CEEB ',
              backgroundColor: gradientTopup,
              tension: 0.4,
              fill: true,
              borderWidth: 2,
              pointRadius: 0
            },
            {
              label: 'Payment',
              data: payments,
              borderColor: '#F87171',
              backgroundColor: gradientPayment,
              tension: 0.4,
              fill: true,
              borderWidth: 2,
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false } // ซ่อน legend เพื่อให้ดู clean แบบในภาพ
          },
          scales: { 
            x: {
              title: { display: false },
              ticks: { color: '#6b7280' },
              grid: { display: false }
            },
            y: {
              title: { display: false },
              ticks: { color: '#6b7280' },
              grid: { color: '#f3f4f6' }
            }
          }
        }
      });
    }
    //------------------------- End Load card data and render chart -------------------------

    //------------------------- Transactions -------------------------
    let txData = [];
    let currentPage = 1;
    const perPage = 6;

    async function loadTransactions() {
      const res = await fetch("/api/history/full");
      txData = await res.json();
      renderTransactions();
      updatePagination();
    }

    function renderTransactions() {
      const list = document.getElementById("txList");
      list.innerHTML = "";

      const start = (currentPage - 1) * perPage;
      const end = start + perPage;
      const pageData = txData.slice(start, end);

      pageData.forEach(tx => {
        const div = document.createElement("div");
        div.className = "tx-item";
        div.innerHTML = `
          <div class="tx-left">
            <div class="tx-card">Card ID: ${tx.card_id}</div>
            <div class="tx-id">Txn #${tx.txn_id}</div>
          </div>
          <div class="tx-right">
            <div class="tx-type ${tx.purpose}">
              ${tx.purpose === "topup" ? "Top-up" : "Payment"}  
            </div>
            <div class="tx-amount">฿${Number(tx.amount).toFixed(2)}</div>
            <div class="tx-time">${new Date(tx.txn_time).toLocaleString("th-TH")}</div>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function updatePagination() {
      const totalPages = Math.ceil(txData.length / perPage);
      document.getElementById("pageInfo").textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById("prevBtn").disabled = currentPage === 1;
      document.getElementById("nextBtn").disabled = currentPage === totalPages;
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderTransactions();
        updatePagination();
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      const totalPages = Math.ceil(txData.length / perPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderTransactions();
        updatePagination();
      }
    });

    document.addEventListener("DOMContentLoaded", loadTransactions);
    //------------------------- End Transactions -------------------------




    const selectDropdownBtn = document.getElementById("selectDropdown");
    const selectedNameEl = document.getElementById("selectedCardName");
    const selectedBalanceEl = document.getElementById("selectedCardBalance");
    const cardListPopup = document.getElementById("cardListPopup");

    // โหลดบัตรและสร้าง list
    async function loadSelectableCards() {
      try {
        const res = await fetch(`${API}/api/customers`);
        const data = await res.json();

        cardListPopup.innerHTML = "";
        data.forEach(c => {
          const div = document.createElement("div");
          div.textContent = `${c.full_name} (${c.card_id})`;
          div.style.padding = "8px 12px";
          div.style.cursor = "pointer";
          div.addEventListener("click", () => {
          selectedNameEl.innerText = c.full_name;

          // ดึงยอดเงินปัจจุบันที่แสดงอยู่
          const currentBalance = parseFloat(selectedBalanceEl.innerText) || 0;
          const targetBalance = parseFloat(c.balance);

          // เรียกใช้อนิเมชั่นยอดเงิน
          animateValue("selectedCardBalance", currentBalance, targetBalance, 1500);

          cardListPopup.style.display = "none";
        });
          div.addEventListener("mouseover", () => div.style.background = "#f0f0f0");
          div.addEventListener("mouseout", () => div.style.background = "white");
          cardListPopup.appendChild(div);
        });

        // กดปุ่มรูปภาพ เปิด/ปิด popup
        selectDropdownBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          cardListPopup.style.display = cardListPopup.style.display === "block" ? "none" : "block";
        });

        // คลิกนอก popup ปิด popup
        document.addEventListener("click", (e) => {
          if (!selectDropdownBtn.contains(e.target) && !cardListPopup.contains(e.target)) {
            cardListPopup.style.display = "none";
          }
        });

        

      } catch(err) {
        console.error("โหลดบัตรล้มเหลว:", err);
      }
    }
    




    loadSelectableCards();
    loadSummary();
    loadCards();
  
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from "three";
  import { MTLLoader } from "three/addons/loaders/MTLLoader.js";
  import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";

  const container = document.getElementById("modelContainer");
  const loadingEl = document.getElementById("loading");

  // สร้าง Scene / Camera / Renderer
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth / container.clientHeight,
    0.1,
    1000
  );
  camera.position.set(2, 1.5, 3);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  // แสง
  scene.add(new THREE.AmbientLight(0xffffff, 10));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  // ควบคุมหมุนกล้อง
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 2.0;

  // โหลดโมเดล
  const mtlLoader = new MTLLoader();
  mtlLoader.setPath('/result/');
  mtlLoader.load('model.mtl', (materials) => {
    materials.preload();
    const objLoader = new OBJLoader();
    objLoader.setMaterials(materials);
    objLoader.setPath('/result/');
    objLoader.load('model.obj', (object) => {
      // ขนาดโมเดล
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      // วางโมเดลให้กึ่งกลางที่ origin
      object.position.x -= center.x;
      object.position.y -= center.y;
      object.position.z -= center.z;

      object.rotation.x = Math.PI;
      // เพิ่มโมเดลลง scene
      scene.add(object);

      // ปรับกล้องให้เห็นโมเดลเต็ม
      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
      camera.position.set(cameraZ, cameraZ * 0.4, cameraZ); // เอียงเล็กน้อย
      camera.lookAt(new THREE.Vector3(0, 0, 0));

      controls.update();
      loadingEl.style.display = "none";
    });
  });


  // ปรับขนาด
  window.addEventListener("resize", () => {
    const width = container.clientWidth;
    const height = container.clientHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);
  });


  // ลูป
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
</script>

  </script>
  </body>
