<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกิดข้อผิดพลาด</title>
  <link rel="icon" href="https://i.postimg.cc/Xq17pCHf/icons8-credit-card-cash-withdrawal-64.png" type="image/x-icon">
  <style>
    body {
      font-family: 'Prompt', 'Segoe UI', sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .error-box {
      background-color: #ffffff;
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-sizing: border-box;
    }

    .icon {
      width: 64px;
      
    }

    h2 {
      color: #d32f2f;
      font-size: 22px;
      margin-bottom: 15px;
    }

    p {
      font-size: 16px;
      color: #37474f;
    }

    @media (max-width: 480px) {
      h2 {
        font-size: 18px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="error-box">
    <img src="https://i.postimg.cc/QCH8RqsW/icons8-sad-100.png" alt="icon" class="icon">
    <h2>⚠️ เกิดข้อผิดพลาด</h2>
    <p>{{ message }}</p>
  </div>
</body>
</html>
